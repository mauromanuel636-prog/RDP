name: 2 - Reconfigurar
on: workflow_dispatch
permissions:
  contents: write

jobs:
  reconfigurar:
    runs-on: windows-2025
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Habilitar RDP
        shell: pwsh
        env:
          RDP_PASS: ${{ secrets.RDP_PASS }}
        run: |
          Set-ItemProperty 'HKLM:\System\CurrentControlSet\Control\Terminal Server' fDenyTSConnections 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-LocalUser runneradmin -Password (ConvertTo-SecureString $env:RDP_PASS -AsPlainText -Force)

      - name: Instalar programas
        continue-on-error: true
        shell: pwsh
        run: choco install -y --no-progress steam-client libreoffice-fresh retroarch ppsspp pcsx2

      - name: Instalar Packet Tracer
        continue-on-error: true
        shell: pwsh
        run: |
          gh release download instaladores -p "PacketTracer.exe" -D C:\inst --repo ${{ github.repository }}
          Start-Process C:\inst\PacketTracer.exe -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait

      - name: Restaurar backup
        continue-on-error: true
        shell: pwsh
        run: |
          gh release download dados -p backup.zip -D C:\ --repo ${{ github.repository }}
          7z x -y -oC:\ C:\backup.zip

      - name: Sessão RDP
        timeout-minutes: 340
        continue-on-error: true
        shell: pwsh
        run: |
          New-Item C:\dados -ItemType Directory -Force | Out-Null
          Set-Content C:\Users\Public\Desktop\SALVAR-E-ENCERRAR.bat "echo ok > C:\stop.txt"
          Invoke-WebRequest "https://github.com/ekzhang/bore/releases/download/v0.5.2/bore-v0.5.2-x86_64-pc-windows-msvc.zip" -OutFile bore.zip
          Expand-Archive bore.zip -DestinationPath .
          Start-Process ./bore.exe -ArgumentList "local 3389 --to bore.pub" -RedirectStandardOutput bore.log -RedirectStandardError bore.err -NoNewWindow
          Start-Sleep 15
          Get-Content bore.log, bore.err
          while (-not (Test-Path C:\stop.txt)) { Start-Sleep 10 }

      - name: Devolver backup
        if: always()
        shell: pwsh
        run: |
          Set-Location C:\
          Remove-Item C:\backup.zip -ErrorAction SilentlyContinue
          7z a -tzip -mx=1 backup.zip Users\runneradmin\Desktop Users\runneradmin\Documents Users\runneradmin\AppData\Roaming dados
          gh release upload dados C:\backup.zip --clobber --repo ${{ github.repository }}
